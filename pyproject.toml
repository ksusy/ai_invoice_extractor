[project]
name = "ai-invoice-extractor"
version = "0.1.0"
description = "Automatická extrakce dat ze skenovaných faktur dodavatelů energií pomocí OCR a velkých jazykových modelů."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pdfminer.six>=20231228",
]

[project.optional-dependencies]
# Reportovací notebooky — čtou předpočítané výsledky, nepotřebují OCR ani API klíč.
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
]
# Plná pipeline — předzpracování obrazu, OCR a generování syntetických faktur.
pipeline = [
    "pytesseract>=0.3",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "pypdfium2>=4.30",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "reportlab>=4.2",
    "tqdm>=4.66",
]
llm = [
    "openai>=1.30",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = [
    "ai-invoice-extractor[pipeline,llm,dev,notebooks]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Kód je v adresáři src/ a tak se i importuje (``from src.core...``), proto se
# balí právě tento adresář. Bez tohoto určení hatchling neví, co má zabalit,
# a instalace skončí chybou při generování metadat.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Jádro kontrol: skutečné chyby (F), řazení importů (I), typické nástrahy (B)
# a modernizace zápisu (UP). Stylové kontroly zůstávají, s výjimkami níže.
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
    "E501",   # délku řádku hlídá formátovací limit výše, ne chybová hláška
    "B905",   # zip(strict=) — doplňuje se cíleně, ne plošně
]

[tool.ruff.lint.per-file-ignores]
# Skripty pro dávkové běhy jsou psané hutným výzkumným stylem: podmínky
# a přiřazení na jednom řádku, importy uvnitř funkcí kvůli volitelným
# závislostem. Na čitelnost výsledků to vliv nemá.
"scripts/*.py" = ["E402", "E701", "E702", "E741", "SIM", "B"]
"experiments/*.py" = ["E402"]
# Notebooky načítají styl hvězdičkovým importem záměrně — zkracuje to buňky
# a jde o report, ne o knihovnu. Import thesis_style navíc musí následovat až
# po úpravě sys.path, takže jej nelze seřadit mezi ostatní (I001).
"experiments/notebooks/*.ipynb" = ["F403", "F405", "E402", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
]
markers = [
    "integration: marks tests requiring a database",
    "slow: marks tests that take more than 10 seconds",
]
