# Kontrola kvality kódu a testy při každém pushi.
# Notebooky se nespouštějí — jsou uloženy včetně výstupů a čtou předpočítaná data.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalace závislostí
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Testy
        run: pytest -q
