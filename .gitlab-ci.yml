# Kontrola kvality kódu a testy při každém pushi.
# Notebooky se nespouštějí — jsou uloženy včetně výstupů a čtou předpočítaná data.

image: python:3.11-slim

stages:
  - kontrola
  - testy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - pip install --upgrade pip
  - pip install -e ".[dev]"

lint:
  stage: kontrola
  script:
    - ruff check src/ tests/ scripts/

pytest:
  stage: testy
  script:
    - pytest -q
